<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>هل أنت فرح؟</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#fff;font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;color:#2b2745;-webkit-tap-highlight-color:transparent}
.screen{position:fixed;inset:0;height:100dvh;opacity:0;pointer-events:none;z-index:1;transition:opacity .5s ease;overflow:hidden}
.screen.active{opacity:1;pointer-events:auto;z-index:2}

/* Glass buttons */
.glass{font:inherit;font-size:clamp(1.05rem,4.2vw,1.4rem);font-weight:600;color:inherit;cursor:pointer;
 padding:.85em 1.8em;min-width:clamp(110px,28vw,170px);
 background:rgba(255,255,255,.32);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
 border:1px solid rgba(255,255,255,.55);border-radius:20px;box-shadow:0 8px 28px rgba(60,40,120,.18);
 animation:bob 4s ease-in-out infinite;transition:opacity .12s ease,transform .25s ease,box-shadow .25s ease;touch-action:manipulation}
.glass:hover{animation-play-state:paused;transform:translateY(-3px);box-shadow:0 14px 34px rgba(60,40,120,.25)}
.glass:nth-child(2n){animation-delay:-1.3s}.glass:nth-child(3n){animation-delay:-2.4s}
.glass:focus-visible{outline:3px solid #6c5ce7;outline-offset:3px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.opt.moving{opacity:0;pointer-events:none}

.q{font-size:clamp(1.6rem,7vw,2.8rem);font-weight:700;text-align:center;line-height:1.5;padding:0 6vw}
.opts{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:center;padding:0 5vw}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(28px,7vh,60px)}

/* Gate screen 1 */
#g1{background:linear-gradient(135deg,#cdbfff 0%,#ffd0e6 48%,#cfe6ff 100%)}
#g1::before{content:"";position:absolute;width:70vmax;height:70vmax;right:-25vmax;top:-30vmax;border-radius:50%;
 background:radial-gradient(circle,rgba(255,255,255,.75),rgba(255,255,255,0) 62%);pointer-events:none}
#g1::after{content:"";position:absolute;width:60vmax;height:60vmax;left:-25vmax;bottom:-28vmax;border-radius:50%;
 background:radial-gradient(circle,rgba(168,148,255,.35),rgba(168,148,255,0) 65%);pointer-events:none}
#g1 .center{position:relative;z-index:2;height:100%}
#g1 .glass{background:rgba(255,255,255,.42);border-color:rgba(124,106,230,.35);padding:.7em 1.6em;min-width:clamp(96px,24vw,150px)}

/* Yes button */
#yesBtn{background:rgba(60,200,140,.24);border-color:rgba(40,180,120,.55);font-size:clamp(1.15rem,4.6vw,1.6rem);
 opacity:0;transform:translateY(14px) scale(.9);transition:opacity .45s ease,transform .45s ease;pointer-events:none}
#yesBtn.show{opacity:1;transform:none;pointer-events:auto}

/* Gate screen 2 */
#g2{background:linear-gradient(135deg,#ffd9ea,#dccdff 55%,#c9e8ff)}
#g2 .q{font-size:clamp(1.5rem,6vw,2.4rem)}
#g2 .glass{background:rgba(255,255,255,.42);border-color:rgba(124,106,230,.4);min-width:clamp(120px,30vw,180px)}
#g2 .c1{background:rgba(255,140,185,.38)}#g2 .c2{background:rgba(160,130,255,.38)}
#g2 .c3{background:rgba(110,205,250,.42)}#g2 .c4{background:rgba(120,225,185,.45)}

/* شاشة الانتظار: بدون أي مؤشر تحميل */
#wait{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
 background:linear-gradient(135deg,#ffd9ea,#dccdff 55%,#c9e8ff);
 opacity:0;pointer-events:none;transition:opacity .35s ease;font-size:clamp(1.05rem,4vw,1.3rem);font-weight:600;color:#4a4270}
#wait.show{opacity:1;pointer-events:auto}
#wait .glass{background:rgba(255,255,255,.5);border-color:rgba(124,106,230,.4);opacity:0;pointer-events:none;transition:opacity .4s ease}
#wait .glass.ready{opacity:1;pointer-events:auto}

#siteFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;z-index:20;opacity:0;transition:opacity .45s ease}

@media (prefers-reduced-motion:reduce){.glass{animation:none}}
</style>
</head>
<body>

<section class="screen active" id="g1">
  <div class="center">
    <p class="q">أكملت 18 عامًا… هل أنت فرح؟</p>
    <div class="opts" id="noOpts">
      <button class="glass opt" type="button">لا</button>
      <button class="glass opt" type="button">لا أعرف</button>
      <button class="glass opt" type="button">أبدًا</button>
    </div>
    <button class="glass" id="yesBtn" type="button">نعم</button>
  </div>
</section>

<section class="screen center" id="g2">
  <p class="q">من هو أكثر شخص تحبّه؟</p>
  <div class="opts">
    <button class="glass opt c1" data-run type="button">أبي</button>
    <button class="glass opt c2" data-run type="button">روان</button>
    <button class="glass opt c3" data-go type="button">أنس</button>
    <button class="glass opt c4" data-run type="button">كلهم</button>
  </div>
</section>

<div id="wait"><span id="waitText">لحظة…</span><button class="glass" id="waitGo" type="button">متابعة</button></div>

<script>
const CONFIG = {
  video1: "./assets/video1.mp4",   // الفيديو الافتتاحي
  video2: "./assets/video2.mp4",   // الفيديو النهائي
  images: ["./assets/img1.jpg", "./assets/img2.jpg", "./assets/img3.jpg",
           "./assets/img4.jpg", "./assets/img5.jpg"],
  next:   "./index.html"           // الموقع بعد انتهاء الصفحتين
};

const $ = (s, r = document) => r.querySelector(s);

/* ---------- تحميل صامت بالخلفية: لا يوجد أي مؤشر على الشاشة ---------- */
const wait = $("#wait"), waitText = $("#waitText"), waitGo = $("#waitGo");
let ready = false, pendingGo = false, started = false;

function markReady() {
  if (ready) return;
  ready = true;
  /* لا انتقال تلقائي: الصفحة لا تختفي إلا بضغطة المستخدم */
  if (pendingGo) {
    pendingGo = false;
    waitText.textContent = "جاهز";
    waitGo.classList.add("ready");
  }
}

async function sizeOf(url) {
  try {
    const r = await fetch(url, { method: "HEAD" });
    return parseInt(r.headers.get("content-length") || "0", 10) || 0;
  } catch (e) { return 0; }
}

async function download(url) {
  const res = await fetch(url, { cache: "force-cache" });
  if (!res.ok) throw new Error("HTTP " + res.status);
  if (!res.body) { await res.arrayBuffer(); return; }
  const reader = res.body.getReader();
  for (;;) {
    const { done } = await reader.read();
    if (done) break;
  }
}

async function preload() {
  for (const url of [CONFIG.video1, CONFIG.video2]) {
    try { await download(url); } catch (e) { /* لا نمنع المستخدم عند فشل الشبكة */ }
  }
  markReady();
  /* الصور تُحمّل بعد الفيديوهين وبصمت */
  await Promise.all(CONFIG.images.map(u => fetch(u, { cache: "force-cache" }).catch(() => {})));
}
preload();

/* ---------- الشاشة الأولى: أزرار تهرب (تختفي وتظهر بمكان آخر) ---------- */
const noOpts = $("#noOpts"), yesBtn = $("#yesBtn");
let presses = 0, finishing = false;

function countPress() {
  if (finishing) return;
  presses++;
  if (presses >= 3) finishRefusals();
}

function finishRefusals() {
  finishing = true;
  noOpts.querySelectorAll(".opt").forEach(b => {
    b.style.animation = "none";
    b.style.transition = "opacity .45s ease, transform .45s ease, filter .45s ease";
    b.style.opacity = "0";
    b.style.transform = "scale(.7)";
    b.style.filter = "blur(3px)";
  });
  setTimeout(() => {
    noOpts.querySelectorAll(".opt, span").forEach(el => el.remove());
    yesBtn.classList.add("show");
  }, 520);
}

function goTo(id) {
  document.querySelectorAll(".screen").forEach(s => {
    const on = s.id === id;
    s.classList.toggle("active", on);
    s.inert = !on;
  });
}
document.querySelectorAll(".screen").forEach(s => { s.inert = !s.classList.contains("active"); });

yesBtn.addEventListener("click", () => goTo("g2"));

/* ---------- خوارزمية هروب الزر (نفس index.html) ---------- */
function makeRunaway(button, container, onPress) {
  let placeholder = null, busy = false, lastPress = 0;
  const M = 20, MIN_DIST = 100;

  function visibleRects() {
    return [...container.querySelectorAll(".opt, .q")]
      .filter(e => e !== button && e.getClientRects().length && !e.classList.contains("moving"))
      .map(e => e.getBoundingClientRect());
  }

  function pickPosition() {
    const cr = container.getBoundingClientRect(), r = button.getBoundingClientRect();
    const w = r.width, h = r.height, pad = 12;
    const minX = Math.max(cr.left, 0) + M, minY = Math.max(cr.top, 0) + M;
    const maxX = Math.max(minX, Math.min(cr.right, innerWidth) - M - w);
    const maxY = Math.max(minY, Math.min(cr.bottom, innerHeight) - M - h);
    const cx = r.left + w / 2, cy = r.top + h / 2;
    const others = visibleRects();
    let best = null, bestScore = -Infinity;
    for (let i = 0; i < 20; i++) {
      const x = minX + Math.random() * (maxX - minX), y = minY + Math.random() * (maxY - minY);
      const dist = Math.hypot(x + w / 2 - cx, y + h / 2 - cy);
      const overlaps = others.filter(o => x < o.right + pad && x + w > o.left - pad && y < o.bottom + pad && y + h > o.top - pad).length;
      if (!overlaps && dist >= MIN_DIST) return { x, y };
      const score = -overlaps * 1000 + Math.min(dist, MIN_DIST);
      if (score > bestScore) { bestScore = score; best = { x, y }; }
    }
    return best;
  }

  function escape(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    const pressed = e && (e.type === "pointerdown" || e.type === "mousedown" || e.type === "touchstart" || e.type === "click");
    if (onPress && pressed) {
      const now = Date.now();
      if (now - lastPress > 250) { lastPress = now; onPress(); }
    }
    if (busy) return;
    busy = true;
    if (!placeholder) {
      const r = button.getBoundingClientRect();
      placeholder = document.createElement("span");
      placeholder.style.cssText = `display:inline-block;width:${r.width}px;height:${r.height}px;visibility:hidden`;
      button.before(placeholder);
      button.style.position = "fixed";
      button.style.margin = "0";
      button.style.width = r.width + "px";
      button.style.left = r.left + "px";
      button.style.top = r.top + "px";
    }
    button.classList.add("moving");
    setTimeout(() => {
      const p = pickPosition();
      button.style.left = p.x + "px";
      button.style.top = p.y + "px";
      button.classList.remove("moving");
      busy = false;
    }, 130);
  }

  ["pointerenter", "pointerdown", "mousedown", "click", "focus"].forEach(t => button.addEventListener(t, escape));
  button.addEventListener("touchstart", escape, { passive: false });
}

document.querySelectorAll("#noOpts .opt").forEach(b => makeRunaway(b, $("#g1"), countPress));
document.querySelectorAll("#g2 [data-run]").forEach(b => makeRunaway(b, b.closest(".screen")));

/* ---------- بدء الموقع (الفيديوهات تبدأ هنا فقط) ---------- */
function goNext() {
  if (!ready) {
    pendingGo = true;
    wait.classList.add("show");
    return;
  }
  startSite();
}

$("#g2 [data-go]").addEventListener("click", goNext);
waitGo.addEventListener("click", () => {
  if (!ready) return;
  wait.classList.remove("show");
  startSite();
});

function startSite() {
  if (started) return;
  started = true;
  const frame = document.createElement("iframe");
  frame.id = "siteFrame";
  frame.src = CONFIG.next;
  frame.title = "التجربة";
  frame.setAttribute("allow", "autoplay; fullscreen");
  document.body.appendChild(frame);
  let revealed = false;
  const reveal = () => {
    if (revealed) return;
    revealed = true;
    frame.style.opacity = "1";
  };
  frame.addEventListener("load", () => { reveal(); hookMedia(frame); });
  /* احتياط: لو تعذّر تحميل الإطار ننتقل مباشرة */
  setTimeout(() => {
    if (!revealed) { try { location.href = CONFIG.next; } catch (e) {} }
  }, 8000);
}

/* صوت الفيديو الافتتاحي + إيقافه لحظة بدء الفيديو الثاني */
function hookMedia(frame) {
  let tries = 0;
  const attempt = () => {
    tries++;
    let v = null, v2 = null;
    try {
      const d = frame.contentDocument;
      v = d && d.getElementById("video1");
      v2 = d && d.getElementById("video2");
    } catch (e) { return; }
    if (!v) { if (tries < 12) setTimeout(attempt, 300); return; }

    if (v2 && !v2.dataset.stopHooked) {
      v2.dataset.stopHooked = "1";
      v2.addEventListener("play", () => {
        try { v.dataset.stopped = "1"; v.pause(); v.muted = true; } catch (e) {}
      });
    }

    if (!v.muted) return;
    try {
      v.muted = false;
      v.volume = 1;
      const p = v.play();
      if (p && p.catch) p.catch(() => {});
    } catch (e) { return; }
    setTimeout(() => {
      if (v.paused) {            /* المتصفح رفض الصوت: نرجعه مكتومًا حتى لا يتوقف */
        v.muted = true;
        v.play().catch(() => {});
      } else if (tries < 3) {
        setTimeout(attempt, 500);
      }
    }, 350);
  };
  attempt();
  try {
    frame.contentDocument.addEventListener("pointerdown", () => {
      try {
        const v = frame.contentDocument.getElementById("video1");
        if (v && v.muted && !v.dataset.stopped) { v.muted = false; v.play().catch(() => {}); }
      } catch (e) {}
    });
  } catch (e) {}
}
</script>
</body>
</html>
